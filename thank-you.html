<!DOCTYPE html>
<html lang="en-ZA">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — CarePing</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="CarePingFavicon.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #082E2A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      max-width: 440px;
      width: 100%;
      background: #F4F7F5;
      border-radius: 28px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.5);
      animation: rise 0.5s ease-out;
    }

    .tick-circle {
      width: 72px;
      height: 72px;
      background: #0B6E63;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px;
      position: relative;
    }

    .tick-circle::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid #FF4D6D;
      opacity: 0.5;
      animation: pulse 2.2s ease-out infinite;
    }

    .tick-circle i {
      color: white;
      font-size: 28px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.7rem;
      color: #0E2622;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    p {
      color: #587670;
      line-height: 1.6;
      margin-bottom: 22px;
      font-size: 0.98rem;
    }

    .btn-home {
      display: inline-block;
      background: #0B6E63;
      color: white;
      padding: 12px 30px;
      border-radius: 100px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      background: #0F857A;
    }

    .wa-link {
      margin-top: 22px;
      padding-top: 22px;
      border-top: 1px solid #DCE6E2;
    }

    .wa-link a {
      color: #25D366;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .wa-link a:hover {
      text-decoration: underline;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(0.9);
        opacity: 0.6;
      }

      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        animation: none;
      }

      .tick-circle::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="tick-circle"><i class="fas fa-check"></i></div>
    <h1>Message sent</h1>
    <p>Your demo request is in. We'll be in touch within 24 hours — usually sooner.</p>
    <a href="index.html" class="btn-home">Back to home</a>
    <div class="wa-link">
      <a href="#" id="whatsappThankYou"><i class="fab fa-whatsapp"></i> Need it sooner? Chat with us now</a>
    </div>
  </div>

  <script>
    const whatsappBtn = document.getElementById('whatsappThankYou');
    if (whatsappBtn) {
      whatsappBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const phoneNumber = '27639703380';
        const message = encodeURIComponent('Hi! I just submitted a demo request and wanted to follow up.');
        window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
      });
    }
  </script>
</body>

</html>
